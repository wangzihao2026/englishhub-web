<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EnglishHub · 英语学园</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>

<body>
  <div id="app" class="app">

    <!-- 侧边栏（桌面端） -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <div class="logo-text">
          <div class="logo-name">EnglishHub</div>
          <div class="logo-sub">英语学园</div>
        </div>
      </div>
      <nav class="nav" id="nav-desktop"></nav>
      <div class="sidebar-foot">
        <div class="role-switch" id="role-switch"></div>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="btn-menu" aria-label="菜单">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div class="topbar-title" id="topbar-title">首页</div>
        <div class="topbar-right">
          <div class="streak-pill" id="streak-pill" title="连续打卡天数">🔥 <span id="streak-num">0</span> 天</div>
          <span id="account-btn-wrap"></span>
          <div class="role-switch role-switch-top" id="role-switch-top"></div>
        </div>
      </header>
      <main class="view" id="view"></main>
    </div>

    <!-- 底部导航（移动端） -->
    <nav class="bottom-nav" id="nav-bottom"></nav>
  </div>

  <!-- 弹窗 & 提示 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js?v=7"></script>
  <script src="js/data/books.js?v=7"></script>
  <script src="js/data/readings.js?v=7"></script>
  <script src="js/data/quizzes.js?v=7"></script>
  <script src="js/data/dict.js?v=7"></script>
  <script src="js/data/grammar.js?v=7"></script>
  <script src="js/data/writings.js?v=7"></script>
  <script src="js/seed.js?v=7"></script>
  <script src="js/store.js?v=7"></script>
  <script src="js/views-home.js?v=7"></script>
  <script src="js/views-learn.js?v=7"></script>
  <script src="js/views-study.js?v=7"></script>
  <script src="js/sync.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>

</html>
